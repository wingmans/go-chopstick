        sql_package: database/sql
        emit_empty_slices: true
        emit_prepared_queries: true
        omit_unused_structs: true
        rename:
          cik: CIK
  - name: news
    engine: sqlite
    schema: internal/news/sql/schema.sql
    queries: internal/news/sql/queries.sql
    gen:
      go:
        package: dbgen
        out: internal/news/dbgen
