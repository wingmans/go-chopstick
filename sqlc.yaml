version: "2"

sql:
  - name: polling
    engine: sqlite
    schema: internal/chopstick/pipeline/sql/schema.sql
    queries: internal/chopstick/pipeline/sql/queries.sql
    gen:
      go:
        package: dbgen
        out: internal/chopstick/pipeline/dbgen
        sql_package: database/sql
        emit_empty_slices: true
        emit_prepared_queries: true
        omit_unused_structs: true
        rename:
          cik: CIK
          feed_url: FeedURL
  - name: market
    engine: sqlite
    schema: internal/market/store/sql/schema.sql
    queries: internal/market/store/sql/queries.sql
